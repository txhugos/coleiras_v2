workflows:
  ios-compile:
    name: Compilar ColeirasCaes
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compilar para iPhone sem assinatura
        script: |
          xcodebuild -project ColeirasCaes.xcodeproj -scheme ColeirasCaes -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
